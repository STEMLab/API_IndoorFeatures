<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>IndoorJSON Preview Demo</title>

  <!-- External libs -->
  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
  <script src="https://unpkg.com/earcut@2.2.4/dist/earcut.min.js"></script>

  <!-- App styles -->
  <link rel="stylesheet" href="style_demo.css">
</head>
<body>

<div id="app">
  <aside id="side">
    <div class="block createFeature">
        <summary style="cursor: pointer; font-weight: bold; font-size: 1.1em; color: #2c3e50;">
          IndoorFeatures
        </summary>
      <div class="block">
        <div class="label">API Explorer</div>
        <button id="api-get-collections" style="width: 100%;">Load Collections</button>
        <div id="api-status-right" class="tiny" style="margin-top:4px;">No collections loaded.</div>
      </div>

      <div class="label">Navigation</div>
      <div id="db-list" style="max-height: 400px; overflow-y: auto; border: 1px solid #ddd; padding: 4px; border-radius: 4px; background: white;">
        <div class="tiny">Click "Load Collections" to start.</div>
      </div>

      <div class="block Feature hidden" style="margin-top: 15px; padding-left: 10px; border-left: 2px solid #eee;">
          
        <div class="label">POST to: <span id="collection-post-target-name" style="color:blue;">select on right side bar</span> </div>
        <input id="file-input" type="file" accept=".json,application/json" style="width: 100%;"/>
        <button id="indoorFeature-upload-button" style="margin-top: 8px; width: 100%;">Upload Feature</button>
        <div id="indoorFeature-upload-status" class="tiny"></div>

        <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;">

        <div class="delete hidden">
        <div class="label hiddens">DELETE: <span id="indoorFeature-delete-target-name" style="color:blue;">select on right side bar</span></div>
        <button id="indoorFeature-delete-button" class="btn-danger" style="width: 100%;">Delete Selected Feature</button>
        <div id="indoorFeature-delete-status" class="tiny"></div>
        </div> 
      </div>
    </div>

    <div class="block hidden">
      <div class="label">View</div>
      <div id="tabs">
        <button id="btn3d" class="active">3D</button>
        <button id="btn2d">2D</button>
      </div>
    </div>

    <div class="block hidden">
      <div class="label">Level</div>
      <select id="level">
        <option value="__all__">All</option>
      </select>
      <div class="checkrow" style="margin-top:8px;">
        <input id="toggleDual" type="checkbox"/>
        <label for="toggleDual">Show dual graph (nodes & edges)</label>
      </div>
    </div>

    <div class="block search">
      <div class="label">Search by cellSpaceName</div>
      <div class="search">
        <input type="text" placeholder="input name">
        <img src="https://s3.ap-northeast-2.amazonaws.com/cdn.wecode.co.kr/icon/search.png">
      </div>
      <button id="btn-view-search-results" class="btn-text tiny" style="margin-top:5px; display:none;">
        View Results List
      </button>
    </div>

    <div class="block search">
      <div class="label">Search by Poi</div>
      <button class="btn" id="btn-poi">Point of interest</button>
      <button id="btn-view-poi-results" class="btn-text tiny" style="margin-top:5px; display:none;">
        View Results List
      </button>
    </div>

    <div class="block route">
      <div class="label" style="display:flex; justify-content:space-between; align-items:center;">
        <span>Directions</span>
        <span class="tiny" style="color:#888; cursor:pointer;" onclick="document.querySelector('.block.route').classList.add('hidden')">✕</span>
      </div>

      <div class="route-ui-container">
        <div class="route-visuals">
          <div class="dot-start"></div>
          <div class="line-connect"></div>
          <div class="dot-dest"></div>
        </div>

        <div class="route-inputs">
          <input type="text" id="route-start-input" placeholder="Choose starting point" readonly style="cursor: pointer;">
          <div style="height: 8px;"></div> <input type="text" id="route-dest-input" placeholder="Choose destination" readonly style="cursor: pointer;">
        </div>

        <button id="btn-swap-route" class="btn-icon" title="Reverse starting point and destination">
          ⇅
        </button>
      </div>

      <div class="route-actions">
        <button id="btn-get-route" class="btn-primary" disabled>Navigate</button>
        <button id="btn-clear-route" class="btn-text">Clear</button>
      </div>

      <div id="route-status" class="tiny" style="margin-top:8px; color:#666;"></div>
    </div>

    <div class="block hidden">
      <div class="label">Cursor (2D)</div>
      <pre id="cursor">Move mouse over the 2D view…</pre>
    </div>
  </aside>

  <main id="main">
    <div id="plots">
      <div id="plot3d" class="plot"></div>
      <div id="plot2d" class="plot active"></div>
      <div id="plotResult" class="plot" style="background: white; padding: 20px; overflow-y: auto;">
       <h2>Search Results</h2>
       <div id="result-list"></div>
    </div>
  </main>

  <aside id="side-right">
    

    <div class="block hidden">
      <button id="visualize" style="margin-top: 8px; width: 100%;">Visualize</button>
    </div>

    <div class="block">
      <div class="label">API Log</div>
      <pre id="api-log">{}</pre>
    </div>
  </aside>
</div>
</div>

<!-- App logic -->
<script type="module" src="./geometry.js"></script>
<script type="module" src="./viewer.js"></script>
</body>
</html>
